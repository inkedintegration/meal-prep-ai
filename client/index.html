<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FBF7F0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="Talk it out: your kitchen plans itself. Private preview." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Your kitchen</title>
  <link rel="stylesheet" href="styles.css?v=5" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Your kitchen</h1>
      <p class="tagline">talk it out. it plans itself.</p>
    </header>
    <main class="thread" id="thread"></main>
    <div class="quickbar"><button id="quick-plan" class="quick">Plan my week</button><button id="quick-profile" class="quick">Your kitchen</button></div>
    <footer class="composer">
      <textarea id="draft" rows="1" placeholder="What's in your kitchen?" autocomplete="off"></textarea>
      <button id="photo" class="cam" aria-label="Add to pantry from a photo">📷</button>
      <input id="photo-input" type="file" accept="image/*" capture="environment" hidden />
      <button id="send" aria-label="Send">Send</button>
    </footer>
  </div>
  <div class="sheet" id="profile-sheet" hidden>
    <div class="sheet-card">
      <div class="sheet-head">
        <h2>Your kitchen profile</h2>
        <button id="profile-close" class="sheet-x" aria-label="Close">×</button>
      </div>
      <div id="profile-view"></div>
      <div id="profile-sets"></div>
      <button id="profile-edit" class="pf-edit" hidden>Edit these</button>
      <form id="profile-form" hidden>
        <label>Household size <input id="pf-size" type="number" min="1" max="12" inputmode="numeric" /></label>
        <label>Dietary restrictions <input id="pf-restrictions" placeholder="vegetarian, halal, .." /></label>
        <label>Allergies <input id="pf-allergies" placeholder="peanuts, shellfish, .." /></label>
        <label>Cuisines we love <input id="pf-loved" placeholder="mexican, italian, .." /></label>
        <label>Cuisines to skip <input id="pf-avoided" placeholder=".." /></label>
        <label>Ingredients nobody likes <input id="pf-disliked" placeholder="olives, mushrooms, .." /></label>
        <label>Non-negotiables <input id="pf-nn" placeholder="cake on wednesday, meatless mondays, .." /></label>
        <label>Weekly rhythms <input id="pf-rhythms" placeholder="pasta once a week; leftovers become weekend lunches" /></label>
        <button type="submit" class="pf-save">Save changes</button>
        <p class="pf-hint">Saving speaks for you: it sends one tidy message to your kitchen, so you see exactly what changed.</p>
        <p class="pf-hint build-tag">build Oct 19 · v5</p>
      </form>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
